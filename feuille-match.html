<!-- jsPDF chargé depuis CDN : aucune installation nécessaire -->

<script>
const P=[[1,"MOHAMMAD","Bader","9602765325"],[22,"ROSARD","Timeo","9603435274"],[3,"BAHLA","Sami","9602867229"],[5,"BOURCHAK","Abdrahman","9603147254"],[4,"ROUGUI","Rayane","9604337991"],[8,"KOURDI","Hasan","9603925446"],[10,"LAMTHARI","Rayan","9603159809"],[6,"KHOUYI CHERROU","Rayan","9603476187"],[13,"LEVALOIS","Salif","9603726316"],[11,"PASSOS GOMES","Luis","9604354569"],[12,"SEVERAC BERTELLI","Louison","9603436451"],[7,"EL ORCH","Youenn","9602926098"],[9,"FOUGANI","Abdelghani","9603631413"]];
const S=[["KONAN","JEAN LOUIS","9605350613"],["SEVERAC","FABRICE","9605236103"]];
function sel(cl,a){return [...document.querySelectorAll("."+cl+":checked")].map(e=>a[+e.dataset.i])}
document.querySelectorAll(".p").forEach(e=>e.onchange=function(){let n=sel("p",P).length;if(n>12){this.checked=false;alert("Maximum 12 joueurs.");n=12}document.querySelector("#cnt").textContent=n+"/12"});


function latin(s){return String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g," ")}
function pdfEscape(s){return latin(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function downloadPDF(ps,ss){
 const pt=72/25.4, pageW=297*pt, pageH=210*pt, ops=[];
 const C={blue:[.024,.271,.608],light:[.914,.929,.976],head:[.898,.898,.898],grid:[.36,.36,.36],dark:[.30,.32,.38],white:[1,1,1]};
 const X=x=>x*pt, Y=y=>pageH-y*pt;
 function fill(c){ops.push(`${c.join(" ")} rg`)} function stroke(c){ops.push(`${c.join(" ")} RG`)}
 function rect(x,y,w,h,fc,sc,lw=.16){fill(fc);stroke(sc);ops.push(`${X(lw)} w ${X(x)} ${Y(y+h)} ${X(w)} ${X(h)} re B`)}
 function text(t,x,y,size=6,c=C.dark,align="left",w=0){
   t=pdfEscape(t); fill(c); ops.push(`BT /F1 ${size} Tf`);
   let approx=t.length*size*.50/pt, xx=x;
   if(align==="center") xx=x+(w-approx)/2;
   ops.push(`${X(xx)} ${Y(y)} Td (${t}) Tj ET`);
 }
 function fit(t,x,y,w,h,size=6,c=C.dark){
   t=latin(t); let s=size; while(s>4.1 && t.length*s*.50/pt>w-1)s-=.15;
   text(t,x,y+h/2+s*.12,s,c,"center",w)
 }
 const L=14,T=8,FW=130;
 text("EQUIPE 1 :",L,T+4.6,7.2,C.blue);
 rect(L+16,T,FW-16,7,C.light,[.647,.667,.706],.2); fit("BLAGNAC FC 2",L+16,T,FW-16,7,7.6);
 let y=T+8.5, widths=[12,9,30,27,29,23], heads=["","CAT","Nom","Prenom","N de licencie","Blessure"],hh=4.6,rh=4.75,x=L;
 heads.forEach((h,j)=>{rect(x,y,widths[j],hh,C.head,C.grid);fit(h,x,y,widths[j],hh,6);x+=widths[j]}); y+=hh;
 let rows=ps.slice(0,12); while(rows.length<12)rows.push(null);
 rows.forEach((p,i)=>{x=L;let v=p?[String(p[0]),"U13",p[1],p[2],p[3],""]:["","","","","",""];
   v.forEach((q,j)=>{rect(x,y,widths[j],rh,j===0?C.white:C.light,C.grid);fit(q,x,y,widths[j],rh,5.8);x+=widths[j]}); y+=rh});
 y+=.8; const iw=[25,46,21,38],ih=5.2,st=[ss[0]||null,ss[1]||null];
 [["Nom Responsable",st[0],"N de licencie"],["Nom Accompagnant",st[1],""]].forEach((r,i)=>{
   x=L;let vals=[r[0],r[1]?(r[1][0]+" "+r[1][1]):"",r[2],r[1]?r[1][2]:""];
   vals.forEach((v,j)=>{if(j===1||j===3){rect(x,y,iw[j],ih,C.light,[.659,.69,.765]);fit(v,x,y,iw[j],ih,5.9)}
     else text(v,x+.5,y+3.6,5.8,C.blue);x+=iw[j]});y+=ih+.5});
 const stream=ops.join("\n");
 const objs=[
  `<< /Type /Catalog /Pages 2 0 R >>`,
  `<< /Type /Pages /Kids [3 0 R] /Count 1 >>`,
  `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,
  `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
  `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`
 ];
 let pdf="%PDF-1.4\n",offs=[0];
 objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
 const xr=pdf.length; pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
 for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
 const blob=new Blob([pdf],{type:"application/pdf"}),url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="Feuille_match_Blagnac_FC2.pdf";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}
document.querySelector("#pdfBtn").onclick=function(){
 const ps=sel("p",P),ss=sel("s",S); if(!ps.length){alert("Selectionnez au moins un joueur.");return}
 try{downloadPDF(ps,ss);document.querySelector("#msg").textContent="PDF genere. Verifiez vos telechargements."}
 catch(e){alert("Erreur lors de la generation du PDF : "+e.message)}
};
</script></body></html>
