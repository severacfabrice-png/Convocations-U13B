<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Présence U13-B</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#222;background:#fafafa}header{background:#e60023;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}header img{width:42px;height:42px;background:#fff;border-radius:50%}header b{flex:1}header a{color:#fff;text-decoration:none;font-weight:bold}.hero{min-height:620px;background:linear-gradient(90deg,#000b,#0002),url('equipe.jpg') center/cover;display:flex;align-items:center;padding:7%;color:#fff}.hero img{width:140px;background:#fff;border-radius:50%}.hero h1{font-size:44px;margin:18px 0}.btn,button{background:#e60023;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;text-decoration:none;cursor:pointer}.hero .btn{background:#fff;color:#e60023;margin-right:10px}.wrap{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}h1,h2{color:#e60023}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field select,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line{display:grid;grid-template-columns:1fr 45px;gap:6px;margin:6px 0}.line button,.del{background:#666}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f5f5f5;padding:12px;border-radius:10px}.stat b{font-size:25px;color:#e60023}.pie{width:180px;height:180px;border-radius:50%;margin:15px auto}.legend{text-align:center}.legend span{margin:0 8px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd}.match{padding:11px;border:1px solid #ddd;border-radius:9px;margin:8px 0}.match button{float:right;padding:7px}.note{font-size:13px;color:#666}@media(max-width:700px){header{flex-wrap:wrap}header a{font-size:13px}.grid{grid-template-columns:1fr}.hero{min-height:650px;padding:24px}.hero h1{font-size:32px}.hero img{width:110px}.wrap{padding:10px}}
.qtyline{display:grid;grid-template-columns:1fr 92px 45px;gap:6px;margin:7px 0}.qtyline input{padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.edit{background:#e60023;margin-right:5px}.cancel{background:#777}.actions{margin-top:15px;display:flex;gap:8px}.actions button{flex:1}
@media(max-width:700px){.stats5{grid-template-columns:1fr 1fr}.qtyline{grid-template-columns:1fr 75px 42px}}

.match.win{background:#e8f5e9;border-left:7px solid #35a853}
.match.draw{background:#fff3e0;border-left:7px solid #f59e0b}
.match.loss{background:#fdecea;border-left:7px solid #d93025}
.match .resultline{font-size:16px;line-height:1.5}
.playerpick{display:grid;grid-template-columns:1fr 46px;gap:6px;margin:7px 0}.abs{border:1px solid #ddd;border-left:7px solid #e60023;border-radius:9px;padding:11px;margin:8px 0}.abs.just{border-left-color:#f59e0b}.abs.unjust{border-left-color:#d93025}.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.reasonBox{display:none}@media(max-width:700px){.summaryGrid{grid-template-columns:1fr 1fr}}</style></head><body><header><img src="logo.png"><b>Blagnac FC U13-B</b><a href="index.html">Accueil</a><a href="feuille-match.html">Feuille de match</a><a href="statistiques.html">Statistiques</a><a href="presence.html">Présence</a></header>
<div class=wrap><a class=btn href=index.html>← Retour à l’accueil</a><h1 style="margin-top:18px">Présence / Absences</h1><p id=status class=note>Connexion à la base en ligne…</p><div class=grid><div class=card><h2>Rajouter une absence</h2><div class=field><label>Date</label><input id=dt type=date></div><div class=field><label>Concerne</label><select id=eventType><option>Entraînement</option><option>Match</option></select></div><h3>Joueur(s)</h3><div id=players></div><button onclick=addPlayer()>+ Rajouter un joueur</button><div class=field><label>Type d'absence</label><select id=justif onchange=toggleReason()><option value=non>Absence non justifiée</option><option value=oui>Absence justifiée</option></select></div><div id=reasonBox class=reasonBox><div class=field><label>Motif</label><select id=reason onchange=toggleOther()><option>Blessure</option><option>Obligation familiale</option><option>Autre</option></select></div><div id=otherBox class=field style="display:none"><label>Précisez</label><input id=other placeholder="Saisir le motif"></div></div><button style="width:100%;margin-top:10px" onclick=saveAbs()>Enregistrer l’absence</button></div>
<div class=card><h2>Récapitulatif</h2><div class=summaryGrid><div class=stat><b id=total>0</b><br>Absences</div><div class=stat><b id=justN>0</b><br>Justifiées</div><div class=stat><b id=unjustN>0</b><br>Non justifiées</div></div><table><thead><tr><th>Joueur</th><th>Total</th><th>Just.</th><th>Non just.</th></tr></thead><tbody id=summary></tbody></table></div></div><div class=card style="margin-top:18px"><h2>Historique</h2><div id=history></div></div></div>
<script>
const P=[[1, "MOHAMMAD", "Bader"], [22, "ROSARD", "Timeo"], [3, "BAHLA", "Sami"], [5, "BOURCHAK", "Abdrahman"], [4, "ROUGUI", "Rayane"], [8, "KOURDI", "Hasan"], [10, "LAMTHARI", "Rayan"], [6, "KHOUYI CHERROU", "Rayan"], [13, "LEVALOIS", "Salif"], [11, "PASSOS GOMES", "Luis"], [12, "SEVERAC BERTELLI", "Louison"], [7, "EL ORCH", "Youenn"], [9, "FOUGANI", "Abdelghani"]],URL="https://ornbwoffrwzyqcdsmybo.supabase.co",KEY="sb_publishable_Sa_WyR4-7H942OjEr3rOsQ_97SYrsl7";let CACHE=[];let opt=P.map((p,i)=>`<option value="${i}">N° ${p[0]} — ${p[1]} ${p[2]}</option>`).join("");
function H(x={}){return Object.assign({"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},x)}function nm(i){return P[+i][1]+" "+P[+i][2]}function msg(x,b=false){status.textContent=x;status.style.color=b?"#b00020":"#267a37"}
function addPlayer(){let d=document.createElement("div");d.className="playerpick";d.innerHTML=`<select><option value="">Choisir un joueur</option>${opt}</select><button class=del onclick="this.parentElement.remove()">×</button>`;players.appendChild(d)}function toggleReason(){reasonBox.style.display=justif.value==="oui"?"block":"none";toggleOther()}function toggleOther(){otherBox.style.display=justif.value==="oui"&&reason.value==="Autre"?"block":"none"}
async function load(){try{let r=await fetch(`${URL}/rest/v1/absences?select=*&order=date_absence.desc,created_at.desc`,{headers:H()});if(!r.ok)throw Error(await r.text());CACHE=await r.json();render();msg("Données synchronisées en ligne.")}catch(e){msg("Impossible de charger les absences. Créez d’abord la table Supabase « absences ».",true)}}
async function saveAbs(){let ids=[...new Set([...document.querySelectorAll("#players select")].map(x=>x.value).filter(Boolean).map(Number))];if(!dt.value||!ids.length)return alert("Choisissez une date et au moins un joueur.");let motif=justif.value==="oui"?(reason.value==="Autre"?(other.value.trim()||"Autre"):reason.value):"";let rows=ids.map(i=>({date_absence:dt.value,type_evenement:eventType.value,joueur:i,justifiee:justif.value==="oui",motif}));let r=await fetch(`${URL}/rest/v1/absences`,{method:"POST",headers:H({"Prefer":"return=representation"}),body:JSON.stringify(rows)});if(!r.ok)return msg("Échec de l'enregistrement. Vérifiez la policy INSERT.",true);players.innerHTML="";addPlayer();other.value="";load()}
async function delAbs(id){if(!confirm("Supprimer cette absence ?"))return;let r=await fetch(`${URL}/rest/v1/absences?id=eq.${id}`,{method:"DELETE",headers:H()});r.ok?load():msg("Échec de la suppression.",true)}
function render(){total.textContent=CACHE.length;let j=CACHE.filter(x=>x.justifiee).length;justN.textContent=j;unjustN.textContent=CACHE.length-j;let a={};CACHE.forEach(x=>{a[x.joueur]??={t:0,j:0,u:0};a[x.joueur].t++;x.justifiee?a[x.joueur].j++:a[x.joueur].u++});summary.innerHTML=Object.entries(a).sort((x,y)=>y[1].t-x[1].t).map(([i,v])=>`<tr><td>${nm(i)}</td><td><b>${v.t}</b></td><td>${v.j}</td><td>${v.u}</td></tr>`).join("")||'<tr><td colspan=4>Aucune absence</td></tr>';history.innerHTML=CACHE.map(x=>`<div class="abs ${x.justifiee?"just":"unjust"}"><button class=del onclick="delAbs(${x.id})">Suppr.</button><b>${x.date_absence.split("-").reverse().join("/")} — ${nm(x.joueur)}</b><br><small>${x.type_evenement} — ${x.justifiee?"Justifiée : "+x.motif:"Non justifiée"}</small></div>`).join("")||"Aucune absence enregistrée."}addPlayer();toggleReason();load();
</script></body></html>
